<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>買取おおがき 受付状況</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: #f5f5f5; margin: 0; padding: 12px; color: #222; }
  h1 { font-size: 18px; margin: 4px 0 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab { flex: 1; min-width: 70px; padding: 8px 4px; text-align: center; background: #fff; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .tab.active { background: #06c755; color: #fff; border-color: #06c755; font-weight: bold; }
  .card { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .card .row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .card .receipt { font-weight: bold; font-size: 14px; }
  .card .amount { font-weight: bold; color: #06c755; font-size: 15px; }
  .card .name { font-size: 13px; color: #555; margin-bottom: 4px; }
  .card .items { font-size: 12px; color: #666; white-space: pre-line; margin-bottom: 8px; }
  .badges { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #eee; color: #888; }
  .badge.done { background: #e3f6e8; color: #1a8a3d; }
  .bank { font-size: 12px; color: #444; background: #fafafa; border-radius: 6px; padding: 8px; }
  .bank div { margin-bottom: 2px; }
  .empty { text-align: center; color: #999; padding: 40px 0; font-size: 13px; }
  .loading { text-align: center; color: #999; padding: 40px 0; font-size: 13px; }
  .error { text-align: center; color: #c0392b; padding: 40px 0; font-size: 13px; }
</style>
</head>
<body>
<h1>買取おおがき 受付状況</h1>
<div class="tabs">
  <div class="tab active" data-status="未受取">未受取</div>
  <div class="tab" data-status="未検品">未検品</div>
  <div class="tab" data-status="未払い">未払い</div>
  <div class="tab" data-status="all">全件</div>
</div>
<div id="list"><div class="loading">読み込み中...</div></div>

<script>
  // Apps ScriptのウェブアプリURLとトークンをここに設定する(GAS側 doGet のDASHBOARD_TOKENと一致させること)
  const API_URL = 'https://script.google.com/macros/s/AKfycbwGy7TjO0TeBqZ4pPViixNEMD3T7GVKo6mxPZkSPVJ1fu5rxFDXUp1Nfmo56QXAWb1v/exec';
  const TOKEN = '7gCFX_lbPpjzAxlAo4dk3kS6mR4eIM2o';

  const listEl = document.getElementById('list');
  const tabs = document.querySelectorAll('.tab');

  function fmtYen(n) {
    const num = Number(n) || 0;
    return num.toLocaleString('ja-JP') + '円';
  }

  function render(items) {
    if (!items.length) {
      listEl.innerHTML = '<div class="empty">該当する受付はありません</div>';
      return;
    }
    listEl.innerHTML = items.map((it) => `
      <div class="card">
        <div class="row1">
          <span class="receipt">${it.receiptNo}</span>
          <span class="amount">${fmtYen(it.amount)}</span>
        </div>
        <div class="name">${it.entityType === '法人' ? '[法人] ' : ''}${it.name || ''}</div>
        <div class="items">${(it.items || '').replace(/\\n/g, '\n')}</div>
        <div class="badges">
          <span class="badge ${it.received ? 'done' : ''}">${it.received ? '受取済' : '荷物未受取'}</span>
          <span class="badge ${it.inspected ? 'done' : ''}">${it.inspected ? '検品済' : '検品未'}</span>
          <span class="badge ${it.paid ? 'done' : ''}">${it.paid ? '支払済' : '支払未'}</span>
        </div>
        ${it.paymentMethod === '銀行振込' ? `
        <div class="bank">
          <div>支払方法: 銀行振込</div>
          <div>${it.bankName || ''} ${it.bankBranch || ''}</div>
          <div>${it.accountType || ''} ${it.accountNumber || ''}</div>
          <div>名義: ${it.accountHolder || ''}</div>
        </div>` : `<div class="bank">支払方法: ${it.paymentMethod || '-'}</div>`}
      </div>
    `).join('');
  }

  async function load(status) {
    listEl.innerHTML = '<div class="loading">読み込み中...</div>';
    try {
      const res = await fetch(`${API_URL}?token=${encodeURIComponent(TOKEN)}&status=${encodeURIComponent(status)}`);
      const data = await res.json();
      if (data.error) {
        listEl.innerHTML = `<div class="error">エラー: ${data.error}</div>`;
        return;
      }
      render(data);
    } catch (err) {
      listEl.innerHTML = '<div class="error">読み込みに失敗しました</div>';
    }
  }

  tabs.forEach((tab) => {
    tab.addEventListener('click', () => {
      tabs.forEach((t) => t.classList.remove('active'));
      tab.classList.add('active');
      load(tab.dataset.status);
    });
  });

  load('未受取');
</script>
</body>
</html>
